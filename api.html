<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeMI-SRO Consortium | Technical API Specification (Swagger)</title>
    
    <!-- Абсолютно локальное подключение стилей, защищенное от блокировок CDN и CORB -->
    <link rel="stylesheet" href="swagger/swagger-ui.css" />
    
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #444c56; /* Сделали границы ярче */
            --text-main: #f0f6fc;     /* Яркий белый текст для лучшей читаемости */
            --text-muted: #c9d1d9;    /* Светло-серебряный вместо тусклого серого */
            --accent-color: #58a6ff;  /* Яркий финтех-синий */
        }

        html, body {
            background-color: var(--bg-color) !important;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        .api-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        /* Полная кастомизация Swagger UI под ультра-контрастный темный режим (GitHub Dark High Contrast) */
        .swagger-ui {
            background-color: var(--bg-color) !important;
            padding: 20px 40px;
        }

        /* Перезапись всех блеклых серых текстов Swagger на высококонтрастные */
        .swagger-ui .info p, 
        .swagger-ui .info li, 
        .swagger-ui .info td,
        .swagger-ui .opblock-description-wrapper p,
        .swagger-ui .tabli button,
        .swagger-ui .response-col_description {
            color: var(--text-muted) !important;
            font-size: 14px;
        }

        /* Стилизация заголовков параметров и моделей */
        .swagger-ui .info .title,
        .swagger-ui h1, .swagger-ui h2, .swagger-ui h3, .swagger-ui h4, .swagger-ui h5,
        .swagger-ui .opblock .opblock-summary-operation-id,
        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .tabli.active button {
            color: #ffffff !important;
            font-weight: 600;
        }

        /* Выделение блоков кода и JSON структур */
        .swagger-ui pre, 
        .swagger-ui code, 
        .swagger-ui .model-box,
        .swagger-ui .body-param__example {
            background-color: #1c2128 !important;
            border: 1px solid var(--border-color) !important;
            color: #adbac7 !important; /* Контрастный текст для JSON */
            border-radius: 6px;
        }

        /* Корректировка контрастности таблиц параметров */
        .swagger-ui .parameters-col_name,
        .swagger-ui .parameter__name {
            color: #ff944d !important; /* Яркий оранжевый для имен переменных */
            font-weight: 700;
        }

        .swagger-ui .parameter__type {
            color: #79c0ff !important; /* Голубой для типов данных (string, integer) */
        }

        @media (max-width: 768px) {
            .api-header { padding: 15px 20px; }
            .swagger-ui { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="api-header">
        <div style="font-weight: 700; color: #fff; letter-spacing: 0.5px;">DeMI-SRO // Interface Specs</div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

    <!-- Контейнер для Swagger UI -->
    <div id="swagger-ui"></div>

    <!-- Локальные скрипты. Загружаются мгновенно с вашего собственного хостинга GitHub Pages -->
    <script src="swagger/swagger-ui-bundle.js" id="swagger-bundle-script"></script>
    <script src="swagger/swagger-ui-standalone-preset.js"></script>

    <script>
        function runSwaggerDeployment() {
            if (typeof SwaggerUIBundle !== 'undefined') {
                const ui = SwaggerUIBundle({
                    url: "openapi.yaml",
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "BaseLayout",
                    validatorUrl: null,
                    // Включаем нативный темный режим, поддерживаемый Swagger 5.x
                    theme: "dark" 
                });
                window.ui = ui;
                console.log("DeMI-SRO // API Gateway: Local isolated Swagger UI deployed successfully.");
            }
        }

        // Выполняем инициализацию по готовности локального бандла
        const mainBundle = document.getElementById('swagger-bundle-script');
        if (mainBundle) {
            mainBundle.onload = function() {
                runSwaggerDeployment();
            };
            if (mainBundle.complete || typeof SwaggerUIBundle !== 'undefined') {
                runSwaggerDeployment();
            }
        }
    </script>
</body>
</html>
