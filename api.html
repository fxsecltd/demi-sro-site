<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeMI-SRO Consortium | Technical API Specification (Swagger)</title>
    <!-- Переключаем стили на зеркало cdnjs (Cloudflare Infrastructure) -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-color: #58a6ff;
        }

        html, body {
            background-color: var(--bg-color) !important;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .api-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        /* Инверсия стилей под темную ИБ-тему */
        .swagger-ui {
            filter: invert(88%) hue-rotate(180deg);
            background-color: #f2f2f2; 
            padding: 20px 40px;
        }

        .swagger-ui .model-box, 
        .swagger-ui pre, 
        .swagger-ui code,
        .swagger-ui .highlight-code {
            filter: invert(100%) hue-rotate(180deg) !important;
        }

        .swagger-ui .info .title {
            color: #000 !important;
        }

        .swagger-ui .info p, 
        .swagger-ui .info li, 
        .swagger-ui .info td {
            color: #333 !important;
        }

        @media (max-width: 768px) {
            .api-header { padding: 15px 20px; }
            .swagger-ui { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="api-header">
        <div style="font-weight: 700; color: #fff; letter-spacing: 0.5px;">DeMI-SRO // Interface Specs</div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

    <!-- Контейнер для Swagger UI -->
    <div id="swagger-ui"></div>

    <!-- Загрузка скриптов через CDNJS с обработчиком onload для надежной ончейн-инициализации -->
    <script src="https://cloudflare.com" id="swagger-bundle-script"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        function runSwaggerDeployment() {
            if (typeof SwaggerUIBundle !== 'undefined') {
                const ui = SwaggerUIBundle({
                    url: "openapi.yaml",
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "BaseLayout",
                    validatorUrl: null 
                });
                window.ui = ui;
                console.log("DeMI-SRO // API Documentation loaded successfully via Cloudflare CDNJS Backbone.");
            }
        }

        // Привязываем выполнение к событию полной загрузки основного скрипта Swagger
        const mainBundle = document.getElementById('swagger-bundle-script');
        if (mainBundle) {
            mainBundle.onload = function() {
                runSwaggerDeployment();
            };
            // Предохранитель на случай, если скрипт закешировался быстрее, чем отработал парсер
            if (mainBundle.complete || typeof SwaggerUIBundle !== 'undefined') {
                runSwaggerDeployment();
            }
        }
    </script>
</body>
</html>
